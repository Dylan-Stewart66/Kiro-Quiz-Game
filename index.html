<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jezero AI Quiz — Test Your AI, Cloud &amp; Data Knowledge</title>
  <meta name="description" content="A timed quiz game from Jezero AI (CACI) to test your knowledge of AI, cloud architecture, and data governance.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Persistent Header -->
  <header class="site-header">
    <div class="site-logo">
      <svg viewBox="0 0 792 543" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M396 0C614.705 0 792 177.159 792 395.696C792 423.122 789.208 449.896 783.892 475.75H8.1084C2.79234 449.896 2.69301e-05 423.122 0 395.696C0 177.159 177.295 0 396 0ZM396 28C192.739 28 28 192.644 28 395.696C28 413.379 29.2479 430.757 31.6562 447.75H760.344C762.752 430.757 764 413.379 764 395.696C764 192.644 599.261 28 396 28Z" fill="#614293"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M621.62 272.27L738.684 339.902V475.172L621.62 542.799L504.561 475.172V339.902L621.62 272.27Z" fill="#432975"/>

        <path fill-rule="evenodd" clip-rule="evenodd" d="M504.561 475.243L621.622 542.832V407.647L504.561 340.05V475.243Z" fill="#614293"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M409.633 310.52L504.572 365.709V476.088L409.633 531.276L314.692 476.088V365.709L409.633 310.52Z" fill="#432975"/>

        <path fill-rule="evenodd" clip-rule="evenodd" d="M314.23 476.471L409.17 531.773V421.169L314.23 365.861V476.471Z" fill="#614293"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M238.892 345.04L314.245 388.706V476.04L238.892 519.709L163.539 476.04V388.706L238.892 345.04Z" fill="#432975"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M314.232 476.148V388.892L238.648 432.518V519.779L314.232 476.148Z" fill="#553989"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M163.045 476.148L238.628 519.779V432.518L163.045 388.892V476.148Z" fill="#614293"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M107.527 378.754L163.063 411.245V476.23L107.527 508.719L51.9922 476.23V411.245L107.527 378.754Z" fill="#432975"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M163.521 476.319V411.488L107.755 443.9V508.731L163.521 476.319Z" fill="#553989"/>

      </svg>
    </div>
  </header>

  <main id="main-content" class="container" role="main">

    <!-- Landing Screen -->
    <section id="screen-landing" class="screen card" aria-label="Welcome">
      <h1 class="card-title">Jezero AI Quiz</h1>

      <p class="landing-description">
        Test your knowledge of AI, cloud architecture, and data governance. 
        5 minutes on the clock, how many questions can you get right?
      </p>

      <div class="input-group">
        <label for="player-name">Your name</label>
        <input type="text" id="player-name" placeholder="Enter your name" autocomplete="name" maxlength="40">
      </div>

      <button id="btn-start" class="btn btn-primary" disabled>Start Quiz</button>
    </section>

    <!-- Quiz Screen -->
    <section id="screen-quiz" class="screen card" aria-label="Quiz">
      <div class="quiz-header">
        <span id="question-counter" class="question-counter">Question 1 of 30</span>
        <div class="quiz-meta">
          <span id="score-tracker" class="score-tracker" aria-live="polite" aria-atomic="true">Score: 0</span>
          <div class="timer" aria-live="polite" aria-atomic="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="2"/>
              <path d="M12 9v4l2.5 2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M9 2h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span id="timer-display">5:00</span>
          </div>
        </div>
      </div>

      <div class="timer-bar-container" role="timer" aria-label="Time remaining">
        <div id="timer-bar" class="timer-bar" style="width: 100%"></div>
      </div>

      <div class="progress-bar-container" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
      </div>

      <h2 id="question-text" class="question-text" tabindex="-1"></h2>

      <ul id="options-list" class="options-list" role="list" aria-label="Answer options"></ul>

      <div id="explanation" class="explanation" hidden aria-live="polite">
        <p class="explanation-label">Explanation</p>
        <p id="explanation-text"></p>
      </div>

      <div class="next-btn-container">
        <button id="btn-next" class="btn btn-secondary" hidden>Next Question</button>
      </div>
    </section>

    <!-- Results Screen -->
    <section id="screen-results" class="screen card" aria-label="Results">
      <div class="results-header">
        <h2>Quiz Complete</h2>
        <div class="score-display">
          <span id="score-number" class="score-number">0</span>
          <span id="score-total" class="score-total">/ 30</span>
        </div>
        <p id="score-percentage" class="score-percentage"></p>
        <p id="score-message" class="score-message"></p>
      </div>

      <div class="btn-group">
        <button id="btn-share" class="btn btn-outline">Share Score</button>
        <button id="btn-restart" class="btn btn-secondary">Play Again</button>
      </div>

      <div class="leaderboard">
        <h3>Leaderboard</h3>
        <ul id="leaderboard-list" class="leaderboard-list" aria-label="Top scores"></ul>
      </div>
    </section>

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <p>Made in 20 minutes using <a href="https://kiro.dev" target="_blank" rel="noopener noreferrer">Kiro</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
